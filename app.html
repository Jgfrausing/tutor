<style>
:root {
  --bg: #f5f6fa;
  --surface: #ffffff;
  --surface-2: #eceef5;
  --fg: #1f2335;
  --muted: #5a607a;
  --accent: #2e7de9;
  --accent-2: #9854f1;
  --border: #d5d8e5;
  --code-bg: #eceef5;
  --question: #b15c00;
  --comment: #2e7de9;
  --ok: #387068;
  --danger: #c64343;
  --gold: #8c6c3e;
  --lab: #007197;
  --flash: rgba(46, 125, 233, 0.14);
  --shadow: 0 10px 28px rgba(20, 24, 40, 0.18);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a1b26; --surface: #1f2335; --surface-2: #24283b; --fg: #c0caf5; --muted: #9aa5ce;
    --accent: #7aa2f7; --accent-2: #bb9af7; --border: #3b4261; --code-bg: #16161e;
    --question: #e0af68; --comment: #7aa2f7; --ok: #9ece6a; --danger: #f7768e; --gold: #e0af68; --lab: #7dcfff;
    --flash: rgba(122, 162, 247, 0.16); --shadow: 0 10px 28px rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1a1b26; --surface: #1f2335; --surface-2: #24283b; --fg: #c0caf5; --muted: #9aa5ce;
  --accent: #7aa2f7; --accent-2: #bb9af7; --border: #3b4261; --code-bg: #16161e;
  --question: #e0af68; --comment: #7aa2f7; --ok: #9ece6a; --danger: #f7768e; --gold: #e0af68; --lab: #7dcfff;
  --flash: rgba(122, 162, 247, 0.16); --shadow: 0 10px 28px rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-padding-top: 5rem; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; overflow-x: hidden; }
a { color: var(--accent); }
code, pre { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 0.88em; }
code { background: var(--code-bg); padding: 0.1em 0.35em; border-radius: 4px; }
pre { background: var(--code-bg); padding: 0.9rem 1rem; border-radius: 8px; overflow-x: auto; line-height: 1.5; margin: 0; }
pre code { background: none; padding: 0; font-size: 1em; }
pre code.hljs { background: transparent; padding: 0; }
.confetti { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 80; }
.note-actions .btn-small { font: inherit; font-size: 0.75rem; padding: 0.1rem 0.5rem; border-radius: 6px; border: 1px solid color-mix(in srgb, var(--danger) 60%, transparent); background: none; color: var(--danger); cursor: pointer; }
.note-actions .btn-small:hover { background: color-mix(in srgb, var(--danger) 12%, transparent); }

header.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
.top-inner { max-width: 72rem; margin: 0 auto; padding: 0.6rem 16px; display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
.brand { font-weight: 650; white-space: nowrap; color: var(--fg); text-decoration: none; }
.brand:hover { color: var(--accent); }
.search { flex: 1 1 12rem; position: relative; }
.search input { width: 100%; padding: 0.45rem 0.7rem 0.45rem 2rem; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--fg); font: inherit; font-size: 0.95rem; }
.search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.search svg { position: absolute; left: 0.6rem; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--muted); }
.search kbd { position: absolute; right: 0.55rem; top: 50%; transform: translateY(-50%); font-size: 0.75rem; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 0 0.3rem; }
.actions { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; }
.btn { font: inherit; font-size: 0.88rem; cursor: pointer; padding: 0.4rem 0.7rem; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--fg); text-decoration: none; display: inline-block; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn .count { color: var(--question); font-weight: 650; }
.level-chip { display: inline-flex; align-items: center; gap: 0.45rem; font-size: 0.82rem; padding: 0.25rem 0.6rem; border: 1px solid var(--gold); border-radius: 999px; color: var(--gold); text-decoration: none; white-space: nowrap; }
.level-chip .bar { width: 3.2rem; height: 0.35rem; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.level-chip .bar i { display: block; height: 100%; background: var(--gold); }
.status { font-size: 0.8rem; padding: 0.3rem 0.6rem; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
.status::before { content: ""; display: inline-block; width: 0.5rem; height: 0.5rem; border-radius: 50%; background: currentColor; margin-right: 0.4rem; vertical-align: 0.05em; }
.status[data-state="listening"] { color: var(--ok); border-color: var(--ok); }
.status[data-state="working"] { color: var(--question); border-color: var(--question); }

.banner { max-width: 46rem; margin: 1rem auto 0; padding: 0.6rem 0.9rem; border: 1px solid var(--question); border-radius: 8px; color: var(--question); font-size: 0.9rem; }
.banner[hidden] { display: none; }

main { max-width: 46rem; margin: 0 auto; padding: 1.5rem 16px 6rem; }
main.wide { max-width: 72rem; }
h1 { font-size: 2rem; line-height: 1.2; margin: 0.6rem 0 0.4rem; }
.lede { color: var(--muted); margin-top: 0; }
article h2, .section-title { font-size: 1.35rem; margin: 2.6rem 0 0.8rem; padding-top: 0.6rem; border-top: 1px solid var(--border); }
article h3 { font-size: 1.05rem; margin: 1.6rem 0 0.5rem; }
.crumbs { font-size: 0.85rem; color: var(--muted); display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
.kind { font-size: 0.72rem; font-weight: 650; letter-spacing: 0.05em; text-transform: uppercase; padding: 0.1rem 0.5rem; border-radius: 999px; border: 1px solid currentColor; }
.kind { color: var(--kind-color, var(--accent)); }
.toc { display: flex; flex-wrap: wrap; gap: 0.35rem 0.9rem; font-size: 0.9rem; margin: 1rem 0 0; padding: 0; list-style: none; }
.toc li { margin: 0; }
.paper-box { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 0.8rem 1rem; margin: 1rem 0; font-size: 0.92rem; }
.paper-box p { margin: 0.15rem 0; }
.callout { border-left: 3px solid var(--accent); background: var(--surface); padding: 0.8rem 1rem; border-radius: 0 8px 8px 0; margin: 1.4rem 0; }
.callout.notation { border-left-color: var(--accent-2); }
.callout p { margin: 0; }
.callout p + p { margin-top: 0.5rem; }
.codewrap { margin: 1rem 0; }
figure.fig { margin: 1.4rem 0; }
figure.fig img, figure.fig svg { display: block; width: 100%; height: auto; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
figure.fig figcaption { color: var(--muted); font-size: 0.86rem; margin-top: 0.45rem; }
.md img { display: block; max-width: 100%; height: auto; margin: 0.5rem 0; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
.math { margin: 1rem 0; padding: 0.4rem 0.6rem; overflow-x: auto; overflow-y: hidden; }
ul, ol { padding-left: 1.4rem; }
li { margin: 0.35rem 0; }
.tablewrap { overflow-x: auto; margin: 1rem 0; border: 1px solid var(--border); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 0.92rem; }
th, td { text-align: left; padding: 0.5rem 0.7rem; border-bottom: 1px solid var(--border); vertical-align: top; }
th { background: var(--surface-2); font-weight: 600; }
tbody tr:last-child td { border-bottom: none; }
tr.hl td { background: color-mix(in srgb, var(--accent) 10%, transparent); }

.g-term { text-decoration: underline dotted color-mix(in srgb, var(--accent-2) 70%, transparent); text-underline-offset: 3px; text-decoration-thickness: 1.5px; cursor: help; border-radius: 3px; }
.g-term:hover, .g-term:focus-visible { background: color-mix(in srgb, var(--accent-2) 14%, transparent); outline: none; }
#pop { position: fixed; z-index: 50; width: min(340px, calc(100vw - 32px)); background: var(--surface); color: var(--fg); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); padding: 0.8rem 0.9rem; font-size: 0.9rem; line-height: 1.5; }
#pop[hidden] { display: none; }
.pop-head { display: flex; justify-content: space-between; gap: 0.5rem; align-items: baseline; }
.pop-term { font-weight: 650; font-size: 1rem; }
.chip { font-size: 0.72rem; padding: 0.05rem 0.45rem; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
.pop-def { margin: 0.4rem 0; }
.pop-meta { color: var(--muted); font-size: 0.82rem; margin: 0.3rem 0 0; }
.linkish { font: inherit; background: none; border: none; color: var(--accent); cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 2px; }

.c-block { position: relative; }
.c-add { position: absolute; left: -2.3rem; top: 0.2em; min-width: 1.6rem; height: 1.6rem; padding: 0 0.35rem; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); font: 600 0.8rem/1 inherit; cursor: pointer; opacity: 0; transition: opacity 0.12s; z-index: 2; }
h2 > .c-add { top: 0.95rem; }
.c-block:hover > .c-add, .c-add:focus-visible, .c-add.has-notes, .c-block.open > .c-add, td > .c-add.inline { opacity: 1; }
.c-add:hover { border-color: var(--accent); color: var(--accent); }
.c-add.has-notes { color: var(--comment); border-color: var(--comment); }
.c-add.has-q { color: var(--question); border-color: var(--question); }
.c-add.has-answer { color: var(--accent-2); border-color: var(--accent-2); }
td > .c-add.inline { position: static; float: right; margin-left: 0.5rem; opacity: 0.35; }
tr:hover td > .c-add.inline, td > .c-add.inline.has-notes { opacity: 1; }
.c-block.flash { background: var(--flash); border-radius: 6px; transition: background 0.3s; }

.thread { margin: 0.6rem 0 1rem; padding: 0.7rem 0.8rem; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; font-size: 0.92rem; }
.thread[hidden] { display: none; }
.c-block.linked { background: var(--flash); border-radius: 6px; }
#side { display: none; }
@media (min-width: 1260px) {
  main.with-side { position: relative; margin-left: max(16px, calc((100vw - 70rem) / 2)); margin-right: auto; }
  #side { display: block; position: absolute; top: 0; left: calc(100% + 2rem); width: 22rem; }
  #side .thread { position: absolute; left: 0; right: 0; margin: 0; max-height: 75vh; overflow: auto; transition: top 0.15s; }
  #side .thread:not(.active) .form { display: none; }
  #side .thread.active { border-color: var(--accent); box-shadow: var(--shadow); z-index: 2; }
  #side .reply-box, #side .thread-foot { margin-left: 0.6rem; }
  #side .note.reply { margin-left: 0.6rem; }
}
.thread-row td { padding: 0 0.7rem; background: var(--bg); }
.note { position: relative; padding: 0.5rem 0; border-bottom: 1px solid var(--border); }
.note.claude { border-left: 3px solid var(--accent-2); padding-left: 0.75rem; background: color-mix(in srgb, var(--accent-2) 7%, transparent); border-radius: 0 6px 6px 0; }
.note.reply { margin-left: 1.1rem; }
.note-head { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; font-size: 0.8rem; color: var(--muted); }
.who { font-weight: 700; font-size: 0.8rem; }
.who.you { color: var(--comment); }
.who.claude { color: var(--accent-2); }
.type { font-weight: 650; text-transform: uppercase; letter-spacing: 0.04em; font-size: 0.72rem; }
.type.question { color: var(--question); }
.type.comment { color: var(--comment); }
.type.request { color: var(--accent-2); }
.state { font-size: 0.75rem; padding: 0 0.45rem; border-radius: 999px; border: 1px solid currentColor; }
.state.pending { color: var(--muted); }
.state.working { color: var(--question); }
.note-text { white-space: pre-wrap; margin: 0.2rem 0 0; }
.note-actions { margin-left: auto; display: flex; gap: 0.6rem; }
.note-actions .linkish { font-size: 0.8rem; }
.danger { color: var(--danger); }
.md p { margin: 0.25rem 0 0.45rem; }
.md ul, .md ol { margin: 0.25rem 0 0.45rem; }
.md pre { margin: 0.4rem 0; font-size: 0.85rem; }
.form { display: grid; gap: 0.5rem; margin-top: 0.6rem; }
.form-title { font-size: 0.8rem; color: var(--muted); margin-top: 0.6rem; }
textarea { width: 100%; min-height: 4.5rem; resize: vertical; padding: 0.5rem 0.6rem; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--fg); font: inherit; }
textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.reply-box { margin: 0.4rem 0 0.2rem 1.1rem; display: grid; gap: 0.4rem; }
.reply-box textarea { min-height: 3rem; }
.thread-foot { margin: 0.2rem 0 0.4rem 1.1rem; }
.form-row { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; flex-wrap: wrap; }
.seg button { font: inherit; font-size: 0.85rem; padding: 0.3rem 0.7rem; border: none; background: var(--surface); color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--fg); font-weight: 600; }
.hint { color: var(--muted); font-size: 0.78rem; margin-left: auto; }

.panel { position: fixed; top: 0; right: 0; bottom: 0; z-index: 40; width: min(430px, 100vw); background: var(--surface); border-left: 1px solid var(--border); box-shadow: var(--shadow); display: flex; flex-direction: column; }
.panel[hidden] { display: none; }
.panel-head { display: flex; align-items: center; gap: 0.5rem; padding: 0.8rem 16px; border-bottom: 1px solid var(--border); }
.panel-head h2 { margin: 0; font-size: 1.05rem; flex: 1; }
.panel-body { overflow-y: auto; padding: 0.6rem 16px 2rem; flex: 1; }
.panel-sub { color: var(--muted); font-size: 0.85rem; margin: 0.2rem 0 0.6rem; }
.g-item { border-bottom: 1px solid var(--border); }
.g-item summary { cursor: pointer; padding: 0.55rem 0; display: flex; gap: 0.5rem; align-items: baseline; list-style: none; }
.g-item summary::-webkit-details-marker { display: none; }
.g-item summary .name { font-weight: 600; flex: 1; }
.g-item .body { padding: 0 0 0.8rem; font-size: 0.92rem; }
.g-item .body p { margin: 0 0 0.4rem; }
mark { background: color-mix(in srgb, var(--question) 30%, transparent); color: inherit; border-radius: 2px; }
.tabs { margin: 0.4rem 0 0.8rem; }
.n-item { padding: 0.6rem 0; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
.n-item .excerpt { display: block; color: var(--muted); font-size: 0.82rem; margin-bottom: 0.2rem; text-align: left; }
.n-topic { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin-top: 0.8rem; }
.empty { color: var(--muted); font-size: 0.9rem; padding: 1rem 0; }
#toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 60; max-width: calc(100vw - 32px); background: var(--surface); border: 1px solid var(--accent-2); border-radius: 10px; box-shadow: var(--shadow); padding: 0.6rem 0.9rem; display: flex; gap: 0.8rem; align-items: center; font-size: 0.9rem; }
#toast[hidden] { display: none; }
#toast.xp { border-color: var(--gold); }

.hero { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: 0.8rem; margin: 1rem 0 1.4rem; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 0.7rem 0.9rem; }
.stat .v { font-size: 1.5rem; font-weight: 700; line-height: 1.2; }
.stat .l { color: var(--muted); font-size: 0.82rem; }
.stat .bar { height: 0.4rem; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin-top: 0.4rem; }
.stat .bar i { display: block; height: 100%; background: var(--gold); }
.badges { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0 0 1rem; }
.badge { font-size: 0.8rem; padding: 0.2rem 0.65rem; border-radius: 999px; border: 1px dashed var(--border); color: var(--muted); cursor: help; }
.badge.earned { border: 1px solid var(--gold); color: var(--gold); background: color-mix(in srgb, var(--gold) 12%, transparent); font-weight: 600; }
.tree-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow-x: auto; padding: 0.5rem; }
.tree-wrap svg { display: block; margin: 0 auto; }
.legend { display: flex; flex-wrap: wrap; gap: 0.4rem 1rem; font-size: 0.82rem; color: var(--muted); margin: 0.6rem 0 0; }
.legend span { display: inline-flex; align-items: center; gap: 0.35rem; }
.legend i { width: 0.8rem; height: 0.8rem; border-radius: 3px; border: 2px solid; display: inline-block; }
.node { cursor: pointer; }
.node rect, .node polygon { stroke-width: 2; transition: filter 0.15s; }
.node:hover rect, .node:hover polygon, .node:focus-visible rect, .node:focus-visible polygon { filter: brightness(1.15); }
.node:focus { outline: none; }
.node text { font-size: 12px; fill: var(--fg); pointer-events: none; }
.node .sub { font-size: 10px; fill: var(--muted); }
.node.locked text { fill: var(--muted); }
.node.available rect, .node.available polygon { animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 50% { stroke-opacity: 0.45; } }
.edge { fill: none; stroke-width: 1.6; transition: opacity 0.15s; }
.edge.lit { stroke: var(--gold); stroke-width: 2.6; }
.edge.dim { opacity: 0.25; }
.next-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: 0.7rem; margin: 0.8rem 0; }
.next-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 0.7rem 0.9rem; text-decoration: none; color: var(--fg); display: block; }
.next-card:hover { border-color: var(--accent); }
.next-card .t { font-weight: 650; display: block; margin: 0.25rem 0; }
.next-card .s { color: var(--muted); font-size: 0.85rem; }

.quiz-q { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 0.8rem 1rem; margin: 0.8rem 0; }
.quiz-q .q { font-weight: 600; margin: 0 0 0.5rem; }
.quiz-q label { display: flex; gap: 0.55rem; align-items: flex-start; padding: 0.35rem 0.5rem; border-radius: 6px; cursor: pointer; }
.quiz-q label:hover { background: var(--surface-2); }
.quiz-q input { margin-top: 0.35rem; }
.quiz-q label.right { background: color-mix(in srgb, var(--ok) 18%, transparent); }
.quiz-q label.wrong { background: color-mix(in srgb, var(--danger) 16%, transparent); }
.quiz-q .explain { margin: 0.5rem 0 0; font-size: 0.9rem; color: var(--muted); }
.quiz-result { font-weight: 650; }
.cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr)); gap: 0.8rem; margin: 0.8rem 0; }
.say { font-weight: 600; }
.say-ctl { display: inline-flex; align-items: center; gap: 0.2rem; margin-left: 0.3rem; vertical-align: middle; white-space: nowrap; }
.say-ctl .romaji { color: var(--muted); font-style: italic; font-size: 0.85em; margin-right: 0.2rem; }
.say-btn { display: inline-flex; align-items: center; justify-content: center; min-width: 1.6rem; height: 1.6rem; padding: 0 0.3rem; border: 1px solid var(--border); border-radius: 999px; background: var(--surface-2); color: var(--accent); cursor: pointer; font-size: 0.75rem; font-weight: 600; line-height: 1; user-select: none; }
.say-btn:hover, .say-btn:focus-visible { border-color: var(--accent); outline: none; }
.say-btn.mic { color: var(--accent-2); }
.say-btn.live { background: var(--danger); border-color: var(--danger); color: var(--bg); animation: say-pulse 1s infinite; }
@keyframes say-pulse { 50% { opacity: 0.55; } }
.say-out { display: inline-flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin-left: 0.4rem; font-size: 0.8rem; color: var(--muted); }
.say-out.good > span:first-child { color: var(--ok); font-weight: 600; }
.say-out.close > span:first-child { color: var(--gold); font-weight: 600; }

  function drawTree(box) {
    const parents = n => isSide(n) ? (n.attached_to || []) : (n.prereqs || []);
    const depth = {};
    const depthOf = n => {
      if (depth[n.id] != null) return depth[n.id];
      const ps = parents(n).map(p => NODE[p]).filter(Boolean);
      depth[n.id] = ps.length ? Math.max(...ps.map(depthOf)) + 1 : 0;
      return depth[n.id];
    };
    NODES.forEach(depthOf);
    const layers = [];
    NODES.forEach((n, i) => { (layers[depth[n.id]] = layers[depth[n.id]] || []).push(n); });
    const W = 165, H = 100, NW = 152, NH = 58, STAGGER = NH + 16, MAX_FLAT = 6;
    const spacing = layer => layer.length > MAX_FLAT ? Math.max((NW + 12) / 2, W * (MAX_FLAT - 1) / (layer.length - 1)) : W;
    const place = layer => layer.forEach((n, i) => { pos[n.id] = (i - (layer.length - 1) / 2) * spacing(layer); });
    const pos = {};
    layers.forEach(place);
    const children = {};
    NODES.forEach(n => parents(n).forEach(p => { (children[p] = children[p] || []).push(n.id); }));
    const avgOf = (ids, fallback) => {
      const xs = ids.filter(i => pos[i] != null).map(i => pos[i]);
      return xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : fallback;
    };
    for (let pass = 0; pass < 12; pass++) {
      const down = pass % 2 === 0;
      const order = down ? layers : [...layers].reverse();
      for (const layer of order) {
        const key = n => down ? avgOf(parents(n), pos[n.id]) : avgOf(children[n.id] || [], pos[n.id]);
        layer.sort((a, b) => key(a) - key(b));
        place(layer);
      }
    }
    for (const layer of layers) {
      layer.sort((a, b) => avgOf(parents(a), pos[a.id]) - avgOf(parents(b), pos[b.id]));
      place(layer);
    }
    const rowY = [];
    let yAcc = 24;
    layers.forEach((layer, d) => { rowY[d] = yAcc; yAcc += H + (layer.length > MAX_FLAT ? STAGGER : 0); });
    const staggerOf = {};
    layers.forEach(layer => layer.forEach((n, i) => { staggerOf[n.id] = layer.length > MAX_FLAT && i % 2 ? STAGGER : 0; }));
    const span = Math.max(...Object.values(pos).map(Math.abs));
    const width = 2 * span + NW + 40, height = yAcc + 10;
    const xy = n => ({ x: width / 2 + pos[n.id], y: rowY[depth[n.id]] + staggerOf[n.id] });

        svg.append(svgEl("path", { d, class: "edge", "data-from": p, "data-to": n.id, stroke: doneEdge ? colorOf(NODE[p].kind) : "var(--border)", "stroke-dasharray": isSide(n) ? "5 4" : "" }));
      }
    }
    for (const n of NODES) {
      const { x, y } = xy(n);
      const st = nodeState(n);
      const color = colorOf(n.kind);
      const shape = kindOf(n.kind).shape || (isSide(n) ? "hex" : "rounded");
      const g = svgEl("g", { class: `node ${st}`, tabindex: "0", role: "link", transform: `translate(${x - NW / 2},${y})`, opacity: st === "locked" ? "0.55" : "1" });
      const t = svgEl("title");
      t.textContent = `${n.title}\n${n.summary}\n${st === "locked" ? (isSide(n) ? "Side quest, opens with " + (n.attached_to || []).map(p => NODE[p].title).join(" or ") : "Locked: finish " + (n.prereqs || []).filter(p => !passed(p)).map(p => NODE[p].title).join(", ")) : st === "completed" ? "Completed" : "Available, +" + xpOf(n.kind) + " XP"}`;
      g.append(t);
      const fill = st === "completed" ? `color-mix(in srgb, ${color} 30%, var(--surface))` : "var(--surface)";
      if (shape === "hex") {
        const c = 12;
        g.append(svgEl("polygon", { points: `${c},0 ${NW - c},0 ${NW},${NH / 2} ${NW - c},${NH} ${c},${NH} 0,${NH / 2}`, fill, stroke: color, "stroke-dasharray": st === "completed" ? "" : "4 3" }));
      } else {
        g.append(svgEl("rect", { width: NW, height: NH, rx: shape === "sharp" ? 4 : 12, fill, stroke: color, "stroke-width": kindOf(n.kind).emphasis ? 3 : 2 }));
      }
      const words = n.title.split(" ");
      const lines = [];
      let line = "";
      for (const w of words) {
        if ((line + " " + w).trim().length > 21 && line) { lines.push(line); line = w; } else line = (line + " " + w).trim();
      }
      lines.push(line);
      lines.slice(0, 2).forEach((l, i) => {
        const tx = svgEl("text", { x: NW / 2, y: (lines.length > 1 ? 19 : 25) + i * 14, "text-anchor": "middle", "font-weight": "600" });
        tx.textContent = i === 1 && lines.length > 2 ? l + "..." : l;
        g.append(tx);
      });
      const sub = svgEl("text", { x: NW / 2, y: NH - 8, "text-anchor": "middle", class: "sub" });
      sub.textContent = (st === "completed" ? "Done  " : st === "locked" ? "Locked  " : "") + `${xpOf(n.kind)} XP`;
      g.append(sub);
      const go = () => { location.href = "/t/" + n.id; };
      g.addEventListener("click", go);
      const lit = on => {
        const ancestors = new Set([n.id]);

      g.addEventListener("focus", () => lit(true));
      g.addEventListener("blur", () => lit(false));
      g.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
      svg.append(g);
    }
    box.append(svg);
    const first = NODES.find(n => nodeState(n) === "available");
    if (first && box.scrollWidth > box.clientWidth) box.scrollLeft = xy(first).x - box.clientWidth / 2;

    blockText.set(id, text);
    blockSection.set(id, section);
    const btn = el("button", { class: "c-add", type: "button", title: "Ask a question, request an edit or comment", "aria-label": "Comments and questions" }, "+");
    btn.addEventListener("click", e => { e.stopPropagation(); toggleThread(b); });
    if (b.tagName === "TR") { btn.classList.add("inline"); b.lastElementChild.prepend(btn); } else b.prepend(btn);
  }
  function setupBlocks() {
    if (!doc) return;
    let section = "";
    doc.querySelectorAll("h2, h3, p, li, .codewrap, .math, figure, tbody tr").forEach(b => {
      if (b.closest(".toc, .thread") || b.parentElement.closest("li, .codewrap, .math, figure")) return;
      const text = b.textContent.replace(/\s+/g, " ").trim();
      if (!text || !b.dataset.cid) return;
      if (b.tagName === "H2") section = text;
      registerBlock(b, text, section);
    });
  }
  const excerptOf = id => { const t = blockText.get(id) || ""; return t.length > 110 ? t.slice(0, 107) + "..." : t; };

  function inline(s) {
    const frag = document.createDocumentFragment();
    s.split(/(`[^`]+`|\*\*[^*]+\*\*|\*(?=\S)[^*\n]+?(?<=\S)\*|!\[[^\]]*\]\((?:https?:\/\/|\/files\/)[^)\s]*\)|\[[^\]]+\]\((?:https?:\/\/|\/)[^)\s]*\))/g).forEach((part, i) => {
      if (!(i % 2)) { frag.append(part); return; }
      if (part.startsWith("![")) { const m = part.match(/^!\[([^\]]*)\]\((.+)\)$/); frag.append(el("img", { src: m[2], alt: m[1], loading: "lazy" })); }
      else if (part.startsWith("`")) frag.append(el("code", {}, part.slice(1, -1)));
      else if (part.startsWith("**")) frag.append(el("strong", {}, part.slice(2, -2)));
      else if (part.startsWith("*")) frag.append(el("em", {}, part.slice(1, -1)));
      else { const m = part.match(/^\[([^\]]+)\]\((.+)\)$/); frag.append(el("a", { href: m[2], target: m[2].startsWith("/") ? null : "_blank", rel: "noopener" }, m[1])); }
    });
    return frag;
  }
  function md(text) {
    const box = el("div", { class: "md" });
    text.split(/```[^\n]*\n([\s\S]*?)```/g).forEach((part, i) => {
      if (i % 2) { box.append(el("pre", {}, el("code", {}, part.replace(/\n$/, "")))); return; }
      for (const para of part.split(/\n\s*\n/)) {
        if (!para.trim()) continue;
        const lines = para.trim().split("\n");
        if (lines.every(l => /^\s*[-*] /.test(l))) box.append(el("ul", {}, ...lines.map(l => el("li", {}, inline(l.replace(/^\s*[-*] /, ""))))));
        else if (lines.every(l => /^\s*\d+\. /.test(l))) box.append(el("ol", {}, ...lines.map(l => el("li", {}, inline(l.replace(/^\s*\d+\. /, ""))))));
        else { const p = el("p"); lines.forEach((l, k) => { if (k) p.append(el("br")); p.append(inline(l)); }); box.append(p); }
      }
    });
    renderMath(box);
    highlightCode(box);
    glossarize(box, true);
    return box;
  }

  const rootsFor = id => notes.filter(n => n.block === id && !n.parent).sort((a, b) => a.created.localeCompare(b.created));
  const repliesFor = rootId => notes.filter(n => n.parent === rootId).sort((a, b) => a.created.localeCompare(b.created));
  const threadOpen = root => [root, ...repliesFor(root.id)].some(n => n.status === "pending" || n.status === "working");
  const fmt = iso => new Date(iso).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
  function stateChip(n) {
    if (n.status === "pending") return el("span", { class: "state pending" }, listening ? "Waiting for Claude" : "Queued, Claude is offline");
    if (n.status === "working") return el("span", { class: "state working" }, "Claude is writing");
    return null;
  }
  function noteView(n, isReply) {
    const who = n.author === "claude" ? "claude" : "you";
    const head = el("div", { class: "note-head" }, el("span", { class: "who " + who }, who === "claude" ? "Claude" : "You"));
    if (!isReply) head.append(el("span", { class: "type " + n.type }, TYPE_LABEL[n.type] || n.type));
    head.append(el("span", {}, fmt(n.created)));
    const chip = stateChip(n);
    if (chip) head.append(chip);
    if (who === "you") {
      const what = isReply ? "reply" : ({ question: "question", request: "edit request", comment: "comment" }[n.type] || "note");
      head.append(el("span", { class: "note-actions" }, el("button", { class: "btn-small", type: "button", title: isReply ? "Delete this reply" : "Delete this " + what + " and every reply to it", onclick: async () => {
        if (!confirm(isReply ? "Delete this reply?" : `Delete this ${what} and all its replies?`)) return;
        try { await api("/api/delete", { id: n.id }); await refresh(); if (!nPanel.hidden) renderNotesPanel(); } catch (err) { alert("Delete failed: " + err.message); }
      } }, "Delete " + what)));
    }
    const body = who === "claude" ? md(n.text) : el("p", { class: "note-text" }, n.text);
    return el("div", { class: `note ${who}${isReply ? " reply" : ""}`, "data-id": n.id }, head, body);
  }
  function draftArea(key, placeholder, onSubmit) {
    const ta = el("textarea", { placeholder, "data-draft": key });
    ta.value = drafts.get(key) || "";
    ta.addEventListener("input", () => drafts.set(key, ta.value));
    ta.addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); onSubmit(); } });
    return ta;
  }
  async function send(payload, key, button) {
    if (!payload.text.trim()) return false;
    if (!online) { alert("The notes server is not running. Start it with: " + PLATFORM.serve_cmd); return false; }
    button.disabled = true;
    try { await api("/api/notes", payload); drafts.delete(key); await refresh(); return true; }
    catch (err) { alert("Could not save: " + err.message); return false; }
    finally { button.disabled = false; }
  }
  const sideMQ = matchMedia("(min-width: 1260px)");
  let sideBox = null;
  const sideMode = () => PAGE === "topic" && sideMQ.matches;
  function ensureSide() {
    if (!sideBox) { sideBox = el("div", { id: "side", "aria-label": "Comments and questions" }); main.append(sideBox); }
    return sideBox;
  }
  function placeThread(b) {
    const t = b._thread;
    if (sideMode()) {
      ensureSide().append(t);
      if (b._row) b._row.hidden = true;
      return;
    }
    t.style.top = "";
    if (b.tagName === "TR") {
      if (!b._row) { b._row = el("tr", { class: "thread-row" }, el("td", { colspan: String(b.children.length) })); b.after(b._row); }
      b._row.firstChild.append(t);
      b._row.hidden = t.hidden;
    } else if (b.tagName === "LI") b.append(t);
    else b.after(t);
  }
  function threadOf(b) {
    if (b._thread) return b._thread;
    const list = el("div", { class: "thread-list" });
    const t = el("div", { class: "thread", hidden: "" }, list, newForm(b));
    t._list = list;
    t._block = b;
    t.addEventListener("mouseenter", () => b.classList.add("linked"));
    t.addEventListener("mouseleave", () => b.classList.remove("linked"));
    b._thread = t;
    placeThread(b);
    return t;
  }
  function layoutSide() {
    if (!sideMode() || !sideBox) return;
    const base = main.getBoundingClientRect().top;
    const items = [...sideBox.children].filter(t => !t.hidden)
      .map(t => ({ t, top: t._block.getBoundingClientRect().top - base }))
      .sort((a, b) => a.top - b.top);
    let floor = 0;
    for (const it of items) {
      const top = Math.max(it.top, floor);
      it.t.style.top = top + "px";
      floor = top + it.t.offsetHeight + 12;
    }
  }
  function autoOpenSide() {
    if (!sideMode()) return;
    blocks.forEach((b, id) => { if (rootsFor(id).length) { threadOf(b); renderList(b); setThreadVisible(b, true); } });
  }
  sideMQ.addEventListener("change", () => {
    blocks.forEach(b => { if (b._thread) placeThread(b); });
    autoOpenSide();
    layoutSide();
  });
  addEventListener("resize", () => layoutSide());
  if (window.ResizeObserver) new ResizeObserver(() => layoutSide()).observe(main);
  function newForm(b) {
    const id = b.dataset.bid;
    const key = "new:" + id;
    let type = "question";
    const placeholders = { question: "Ask Claude about this part", request: "Tell Claude how to change the text here, or anywhere in the curriculum", comment: "A note for yourself. Claude does not answer comments" };
    const seg = el("div", { class: "seg", role: "group", "aria-label": "Type" });
    const buttons = Object.entries(TYPE_LABEL).map(([k, label]) => {
      const x = el("button", { type: "button", "aria-pressed": String(k === type) }, label);
      x.addEventListener("click", () => { type = k; buttons.forEach(([kk, bb]) => bb.setAttribute("aria-pressed", String(kk === k))); ta.placeholder = placeholders[k]; });
      seg.append(x);
      return [k, x];
    });
    const save = el("button", { class: "btn primary", type: "button" }, "Send");
    const submit = () => send({ block: id, topic: TOPIC, type, text: ta.value, section: blockSection.get(id), excerpt: excerptOf(id), context: blockText.get(id) }, key, save).then(ok => { if (ok) ta.value = ""; });
    const ta = draftArea(key, placeholders.question, submit);
    save.addEventListener("click", submit);
    ta.addEventListener("keydown", e => { if (e.key === "Escape") { e.stopPropagation(); closeThread(b); } });
    return el("div", { class: "form" }, el("div", { class: "form-title" }, "New"), ta,
      el("div", { class: "form-row" }, seg, save, el("button", { class: "btn", type: "button", onclick: () => closeThread(b) }, "Close"), el("span", { class: "hint" }, "Cmd/Ctrl + Enter sends")));
  }
  function renderList(b) {
    const t = threadOf(b);
    const active = document.activeElement;
    const focusKey = active && active.dataset ? active.dataset.draft : null;
    const sel = focusKey ? [active.selectionStart, active.selectionEnd] : null;
    const list = t._list;
    list.replaceChildren();
    for (const root of rootsFor(b.dataset.bid)) {
      list.append(noteView(root, false));
      repliesFor(root.id).forEach(r => list.append(noteView(r, true)));
      const key = "reply:" + root.id;
      if (openReplies.has(root.id)) {
        const btn = el("button", { class: "btn primary", type: "button" }, "Send reply");
        const submit = () => send({ block: root.block, topic: TOPIC, parent: root.id, text: ta.value }, key, btn).then(ok => { if (ok) { openReplies.delete(root.id); renderList(b); } });
        const ta = draftArea(key, root.type === "comment" ? "Reply" : "Follow up with Claude", submit);
        btn.addEventListener("click", submit);
        list.append(el("div", { class: "reply-box" }, ta, el("div", { class: "form-row" }, btn, el("button", { class: "btn", type: "button", onclick: () => { openReplies.delete(root.id); renderList(b); } }, "Cancel"))));
      } else {
        list.append(el("div", { class: "thread-foot" }, el("button", { class: "linkish", type: "button", onclick: () => { openReplies.add(root.id); renderList(b); list.querySelector(`[data-draft="${key}"]`).focus(); } }, "Reply")));
      }
    }
    if (focusKey) {
      const again = t.querySelector(`[data-draft="${focusKey}"]`);
      if (again && again !== active) { again.focus(); again.setSelectionRange(sel[0], sel[1]); }
    }
  }
  function setThreadVisible(b, visible) {
    const t = threadOf(b);
    t.hidden = !visible;
    if (b._row) b._row.hidden = sideMode() || !visible;
    b.classList.toggle("open", visible && (!sideMode() || t.classList.contains("active")));
    layoutSide();
  }
  function closeThread(b) {
    const t = threadOf(b);
    t.classList.remove("active");
    if (sideMode() && rootsFor(b.dataset.bid).length) { b.classList.remove("open"); layoutSide(); }
    else setThreadVisible(b, false);
  }
  function toggleThread(b, forceOpen) {
    const t = threadOf(b);
    const side = sideMode();
    const open = forceOpen || t.hidden || (side && !t.classList.contains("active"));
    if (!open) { closeThread(b); return; }
    renderList(b);
    t.classList.add("active");
    setThreadVisible(b, true);
    if (side || !rootsFor(b.dataset.bid).length) t.querySelector('[data-draft^="new:"]').focus({ preventScroll: true });
  }
  function updateBadge(b) {
    const btn = b.querySelector(":scope > .c-add, :scope > td > .c-add");
    if (!btn) return;
    const roots = rootsFor(b.dataset.bid);
    const all = notes.filter(n => n.block === b.dataset.bid);
    btn.textContent = roots.length ? String(roots.length) : "+";
    btn.classList.toggle("has-notes", roots.length > 0);
    btn.classList.toggle("has-q", roots.some(threadOpen));
    btn.classList.toggle("has-answer", !roots.some(threadOpen) && all.some(n => n.author === "claude"));
  }
  function updateCount() {
    const waiting = notes.filter(n => !n.parent && threadOpen(n)).length;
    const roots = notes.filter(n => !n.parent).length;
    const c = document.getElementById("notes-count");
    c.textContent = roots ? `(${roots}${waiting ? `, ${waiting} waiting` : ""})` : "";
    c.className = waiting ? "count" : "";
  }
  function updateStatus() {
    const working = notes.some(n => n.status === "working");
    let state = "offline", label = "Claude offline";
    if (!online) label = onServer ? "Server stopped" : "Not on server";
    else if (working) { state = "working"; label = "Claude answering"; }
    else if (listening) { state = "listening"; label = "Claude listening"; }
    statusEl.dataset.state = state;
    statusEl.textContent = label;
    wakeBtn.hidden = !(online && onServer && state === "offline");
  }
  const wakeBtn = document.getElementById("claude-wake");
  wakeBtn.addEventListener("click", async () => {
    wakeBtn.disabled = true;
    wakeBtn.textContent = "Waking...";
    try {
      const r = await api("/api/wake", {});
      showToast(r.ok ? "Asked Claude to start listening again." : "Could not wake Claude: " + r.detail);
    } catch { showToast("Could not reach the server."); }
    setTimeout(() => { wakeBtn.disabled = false; wakeBtn.textContent = "Wake Claude"; }, 60000);
  });
  let filter = "waiting";
  function renderNotesPanel() {
    const box = document.getElementById("n-results");
    const roots = notes.filter(n => !n.parent).filter(n => filter === "all" || (filter === "waiting" ? threadOpen(n) : n.type === filter));
    box.replaceChildren();
    if (!roots.length) { box.append(el("p", { class: "empty" }, notes.length ? "Nothing in this view." : "No notes yet. Hover a paragraph, list item or table row in a lesson and click + to add one.")); return; }
    const topicOf = n => n.topic || n.block.split("/")[0];
    const order = NODES.map(n => n.id);
    roots.sort((a, b) => order.indexOf(topicOf(a)) - order.indexOf(topicOf(b)) || a.created.localeCompare(b.created));
    let lastTopic = null;
    for (const root of roots) {
      const topic = topicOf(root);
      if (topic !== lastTopic) { box.append(el("div", { class: "n-topic" }, NODE[topic] ? NODE[topic].title : topic)); lastTopic = topic; }
      const target = blocks.get(root.block);
      const label = target ? excerptOf(root.block) : (root.excerpt || "");
      const excerpt = target
        ? el("button", { class: "linkish excerpt", type: "button", onclick: () => jumpTo(target) }, label)
        : topic !== TOPIC && NODE[topic] ? el("a", { class: "excerpt", href: `/t/${topic}#${root.block.split("/")[1]}` }, label || "Open")
        : el("span", { class: "excerpt" }, "(this text was removed) " + label);
      const item = el("div", { class: "n-item" }, excerpt, noteView(root, false));
      repliesFor(root.id).forEach(r => item.append(noteView(r, true)));
      box.append(item);
    }
  }
  function jumpTo(b) {
    if (innerWidth < 900) openPanel(null);
    toggleThread(b, true);
    b.scrollIntoView({ behavior: "smooth", block: "center" });
    b.classList.add("flash");
    setTimeout(() => b.classList.remove("flash"), 1400);
  }
  function reloadPage() {
    try { sessionStorage.setItem(PLATFORM.key + "-reload", JSON.stringify({ y: scrollY, path: location.pathname })); } catch {}
    location.reload();
  }
  document.getElementById("reload-now").addEventListener("click", reloadPage);
  function onVersion(version) {
    if (version === BOOT.version) return;
    const typing = [...document.querySelectorAll("textarea")].some(t => t.value.trim()) || document.querySelector(".quiz-q input:checked") || PAGE === "cards";
    if (typing) updateBanner.hidden = false; else reloadPage();
  }
  async function refresh() {
    let state;
    try { state = await api("/api/state" + (TOPIC ? "?topic=" + encodeURIComponent(TOPIC) : "")); }
    catch {
      online = false;
      serverBanner.hidden = false;
      serverBanner.textContent = "The notes server is not running, so notes and progress cannot be saved. Start it with: " + PLATFORM.serve_cmd;
      updateStatus();
      return;
    }
    const firstLoad = !loaded;
    online = true; loaded = true;
    serverBanner.hidden = true;
    listening = state.listening;
    notes = state.notes;
    for (const n of notes) {
      if (!knownIds.has(n.id)) {
        if (!firstLoad && n.author === "claude") {
          const b = blocks.get(n.block);
          const topic = n.topic || n.block.split("/")[0];
          showToast(`Claude replied in "${NODE[topic] ? NODE[topic].title : topic}"${blockSection.get(n.block) ? `, ${blockSection.get(n.block)}` : ""}.`,
            b ? () => jumpTo(b) : () => { location.href = `/t/${topic}#${n.block.split("/")[1]}`; });
        }
        knownIds.add(n.id);
      }
    }
    blocks.forEach((b, id) => {
      const sig = JSON.stringify(notes.filter(n => n.block === id).map(n => [n.id, n.status, n.text])) + listening;
      if (signatures.get(id) !== sig) {
        signatures.set(id, sig);
        updateBadge(b);
        const has = rootsFor(id).length > 0;
        if (sideMode() && has) { threadOf(b); renderList(b); setThreadVisible(b, true); }
        else if (b._thread && !b._thread.hidden) {
          renderList(b);
          if (sideMode() && !has && !b._thread.classList.contains("active")) setThreadVisible(b, false);
        }
      }
    });
    updateCount();
    updateStatus();
    layoutSide();
    if (!nPanel.hidden) renderNotesPanel();
    if (PAGE === "topic") syncJournal(state.journal);
    onVersion(state.version);
  }
  document.getElementById("n-tabs").addEventListener("click", e => {
    const b = e.target.closest("button[data-filter]");
    if (!b) return;
    filter = b.dataset.filter;
    document.querySelectorAll("#n-tabs button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    renderNotesPanel();
  });
  document.getElementById("open-notes").addEventListener("click", () => { renderNotesPanel(); openPanel(nPanel.hidden ? nPanel : null); });

  document.getElementById("notes-sub").append(" Every thread is also saved as markdown in ", el("code", {}, `${PLATFORM.state}/notes/<topic>.md`), ".");
  if (PAGE === "tree") renderTree();
  else if (PAGE === "cards") renderCardsPage();
  else if (PAGE === "review") renderReviewPage();
  else if (PAGE === "topic") {
    main.classList.add("with-side");
    setupBlocks();
    renderTopicShell();
    renderMath(main);
    highlightCode(main);
    glossarize(doc);
    enhanceSay(doc);
    setupReader();
    blocks.forEach(updateBadge);
    if (onServer && !progress.visited[TOPIC]) postProgress({ kind: "visit", topic: TOPIC }).catch(() => {});
    const hashId = location.hash.slice(1);
    const target = hashId && blocks.get(TOPIC + "/" + hashId);
    if (target) setTimeout(() => jumpTo(target), 300);
  }
  updateLevel();
  renderGlossary(false);
  try {
    const r = JSON.parse(sessionStorage.getItem(PLATFORM.key + "-reload") || "null");
    if (r && r.path === location.pathname) {
      sessionStorage.removeItem(PLATFORM.key + "-reload");
      scrollTo(0, r.y);
      showToast("Claude updated the curriculum.");
    }
  } catch {}
  if (onServer) { refresh(); setInterval(refresh, 2500); }
  else { serverBanner.hidden = false; serverBanner.replaceChildren("This page needs the notes server. Open ", el("a", { href: `http://127.0.0.1:${PLATFORM.port}/` }, `http://127.0.0.1:${PLATFORM.port}/`), " instead."); updateStatus(); }
});
</script>
</body>
</html>
